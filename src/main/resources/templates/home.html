<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>홈</title>
</head>
<body>
<h1>홈페이지</h1>
<p th:if="${member != null}">
  안녕하세요, <span th:text="${member.name}">회원</span>님!
  <a th:href="@{/logout}">로그아웃</a>
</p>
<p th:if="${member == null}">
  <a th:href="@{/logins}">로그인</a>
  <a th:href="@{/register}">회원가입</a>
</p>
</body>
</html>
<!--
컨트롤러가 정적 파일보다 우선순위가 높다
-->
